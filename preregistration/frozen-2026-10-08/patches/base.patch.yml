# Applied to every group. Fixed: model, reasoning effort, fork mode as in the Web standard preset,
# workflow tool off (its agents bypass the capacity limit), web search through the company proxy.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
- id: tool-workflow
  disabled: true
- id: web-search-deepseek
  config:
    apiKeyEnv: HIGH_FIVE_API_KEY
    baseURL: https://proxy.high-five-ai.xyz:8443/v1
# 2026-10-08T10:25Z (phase-2 calibration at 32 in parallel): requests fail at the transport level under load and the
# default policy (5 retries, 0.5-10 s, about 16 s in all) loses the whole run; wait up to about 8 minutes instead.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 12
      backoff:
        initialDelayMs: 2000
        maxDelayMs: 60000
        jitterRatio: 0.2
